[project]
name = "steam-games-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["unit: fast tests without external services", "integration: tests requiring Qdrant"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

